<app-auth-layout>
  <div class="w-full max-w-md">

        <!-- Progress Bar -->
    <div class="flex items-center w-full max-w-md mx-auto mb-8">

  <!-- Step 1 -->
  <div class="w-2 h-2 rounded-full bg-blue-500"></div>

  <!-- Line -->
  <div class="flex-1 h-px bg-blue-500"></div>

  <!-- Step 2 -->
  <div class="w-2 h-2 rounded-full bg-blue-500"></div>

  <!-- Line -->
  <div class="flex-1 h-px bg-blue-300"></div>

  <!-- Step 3 -->
  <div class="w-2 h-2 rounded-full bg-blue-500"></div>

  <!-- Line -->
  <div class="flex-1 h-px border-t  border-blue-300"></div>

  <!-- Step 4 -->
  <div class="w-2 h-2 rounded-full bg-blue-500"></div>

</div>

    <h1 class="text-3xl font-bold text-gray-800">
      Create Account
    </h1>

    <p class="text-lg font-bold text-blue    mt-2 mb-6">
      Create a strong password
    </p>

    <div class="space-y-4">
      <app-input-component
        label="Password"
        placeholder="Enter password"
        type="password">
      </app-input-component>

      <app-input-component
        label="Confirm Password"
        placeholder="Confirm password"
        type="password">
      </app-input-component>

      <!-- <div class="text-sm text-gray-600 bg-gray-50 p-3 rounded">
        <p class="font-semibold mb-2">Password requirements:</p>
        <ul class="space-y-1">
          <li>• At least 8 characters</li>
          <li>• Contains uppercase letter</li>
          <li>• Contains lowercase letter</li>
          <li>• Contains number</li>
          <li>• Contains special character</li>
        </ul>
      </div> -->
<div class="white-text">
  <app-button label="Continue" (click)="continue()"></app-button>
</div>

      <p class="text-center text-sm text-gray-500">
        Already have an account?
        <a routerLink="/login" class=" text-blue  font-semibold">
          Login
        </a>
      </p>
    </div>

  </div>
</app-auth-layout>
