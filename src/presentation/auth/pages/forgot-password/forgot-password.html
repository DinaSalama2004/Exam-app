<app-auth-layout>

<div class="w-full max-w-md">


    <h1 class="text-3xl font-bold text-gray-800">
        Forgot Password
    </h1>

    <p class="text-gray-400 font-md mt-2 mb-6">
        Don't worry, we'll help you recover your account.
    </p>

    <div class="space-y-4">
      <app-input-component
        label="Email"
        placeholder="user@gmail.com"
        type="email">
      </app-input-component>

      <app-button label="Next >" (click)="next()"></app-button>

      <p class="text-center text-sm text-gray-500">
        Remember your password?
        <a routerLink="/create-account"
            class=" text-blue  font-semibold">
            Create Yours
        </a>
      </p>
    </div>

</div>

</app-auth-layout>
