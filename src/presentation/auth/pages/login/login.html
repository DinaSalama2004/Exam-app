

<app-auth-layout>

  
  <!-- Right Side -->

    <div class="w-full max-w-md">

      <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-8">
        Login
      </h1>

      <div class="space-y-4">
        <app-input-component
          label="Email"
          placeholder="Enter your email"
          type="email">
        </app-input-component>

        <app-input-component
          label="Password"
          placeholder="Enter your password"
          type="password">
        </app-input-component>

        <div class="flex justify-end">
          <a
            routerLink="/forgot-password"
            class=" text-blue  text-sm hover:underline cursor-pointer">
            Forgot your password?
          </a>
        </div>
<div class="white-button">

   <app-button label="Login"></app-button>
</div>

     

        <p class="text-center text-sm text-gray-500">
          Don't have an account?
          <a
            routerLink="/create-account"
            class=" text-blue  font-semibold">
            Create yours
          </a>
        </p>
      </div>

    </div>
</app-auth-layout>
