<app-auth-layout>

    <h1 class="text-3xl font-bold text-gray-800">
      Create a New Password
    </h1>

    <p class="text-gray-500 mt-2 mb-6">
      Create a new strong password for your account.
    </p>

    <div class="space-y-4">
      <app-input-component

        type="password"

        label="Confirm Password"
        type="password"
        placeholder="Confirm password">
      </app-input-component>
