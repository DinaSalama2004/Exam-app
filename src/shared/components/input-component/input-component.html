<div class="field  flex flex-col gap-2">
  <label class="field-label ">{{ label }}</label>

  <input
    pInputText
    [type]="type"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    class="field-input w-100"

    [class.input-correct]="correct === true"
    [class.input-wrong]="correct === false"
    [class.input-primary]="value && correct === null"


  />
</div>
